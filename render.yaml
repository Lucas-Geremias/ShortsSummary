services:
  - type: web
    name: shorts-summary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: YTDL_NO_UPDATE
        value: "1"
      - key: YOUTUBE_COOKIE
        sync: false
